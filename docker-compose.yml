services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: creative_hub
      POSTGRES_PASSWORD: creative_hub
      POSTGRES_DB: creative_hub
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U creative_hub']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
